 3 premi\xE8res heures de montante et les 3 derni\xE8res de descendante, coefficients de 50 \xE0 80",source:"peche-poissons.com \u2014 J.-B. Vidal (19/10/2026), \xAB Quid des coefficients de mar\xE9e ? \xBB",explain:"R\xE8gle g\xE9n\xE9rale de la source pour le bar en Bretagne, pas propre aux estuaires : \xAB les meilleurs moments sont souvent les 3 premi\xE8res heures de montantes et 3 derni\xE8res heures de descendantes \xBB, coefficients \xAB de 50 \xE0 80 qui sont plus r\xE9guliers et stables \xBB ; \xAB les phases de mar\xE9e [\u2026] vont d\xE9pendre de chaque coin \xBB. Le guide s'en sert comme rep\xE8re, \xE0 recaler avec ton journal."},{rule:"Lire le terrain \xE0 basse mer",source:"peche-poissons.com \u2014 Franck Ripault, p\xEAche du bar en wading dans les abers (P\xEAche Mouche n\xB0 172, 31/07/2026)",explain:"Deux milieux : l'estuaire, \xAB interface entre l'eau douce et l'eau sal\xE9e \xBB, ou la c\xF4te ouverte de sable et de roche. Postes cit\xE9s : cuvettes de sable, rochers isol\xE9s cercl\xE9s d'algues, hauts-fonds rocheux ; une laisse d'algues \xE9chou\xE9es signale un courant. La mont\xE9e de l'eau coupe vite les passages."},{rule:"Courants dans l'axe des abers, travers au large ; brisants d\xE8s 1 m de houle",source:"voileaviron.org \u2014 topo FVA n\xB0 43, \xAB Les Abers \xBB",explain:"Dans les abers, le courant entre et sort \xE0 peu pr\xE8s dans l'axe ; dehors, le courant c\xF4tier le prend souvent en travers : au Libenter, il peut atteindre 3 n\u0153uds (SHOM). Des brisants se forment sur les roches d\xE8s que la houle d\xE9passe 1 m ; les bancs de brume sont fr\xE9quents et difficiles \xE0 pr\xE9voir."},{rule:"S\xE9curit\xE9 en wading",source:"peche-poissons.com \u2014 Franck Ripault (31/07/2026)",explain:"Se renseigner sur les horaires des mar\xE9es, pr\xE9venir quelqu'un de son itin\xE9raire, t\xE9l\xE9phone dans une poche \xE9tanche et sifflet, waders indispensables, attention \xE0 la roche glissante et \xE0 la mer qui monte."}]},Do=[{i

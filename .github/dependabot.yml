# Dependabot — actions GitHub seulement (décision de Félix, 23 nov. 2026, 19 h 07 ; docs/socle/MAINTENANCE-OUTILS.md § 2).
# Une proposition par mois au plus, toutes les actions ensemble ; une version n'est proposée qu'après 7 jours.
# Dependabot met à jour l'empreinte et le commentaire de version (« @<empreinte> # vX.Y.Z »).
# Ne fonctionne que depuis la branche par défaut : actif à la fusion de la V3 dans main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "CI"

# Chaque matin, vérifie contre le vrai service Open-Meteo que les modèles
# (AROME, ECMWF), les variables et les formats utilisés par les deux guides
# existent toujours. En cas d'échec, GitHub envoie un e-mail : on le sait le
# jour même, pas sur le spot. Lancé aussi sur chaque proposition de modification.
name: Contrat Open-Meteo

on:
  schedule:
    - cron: "17 4 * * *"   # 04 h 17 UTC, tous les jours
  pull_request:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read

jobs:
  contrat:
    runs-on: ubuntu-24.04   # fixé, comme les autres passages (ubuntu-latest change sans prévenir)
    timeout-minutes: 30   # coupure réseau : jusqu'à deux nouveaux essais (1 puis 3 min) par appel touché
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Contrat Open-Meteo (réseau réel)
        run: npm run -s test:contract

# Phase 8 — Épreuve du moteur : télécharge les journées de référence (prévisions archivées d'Open-Meteo, houle et eau
# comprises) pour les sept guides, et les garde en artefact (90 jours). Le bac à sable de Claude n'atteint pas
# Open-Meteo ; l'intégration continue, si. Les journées de la phase 8 sont dans le dépôt (data/epreuve/archives/) ;
# ce passage sert à les refaire (autres dates, autre guide). Les tirages Monte Carlo se font ensuite sur ces fichiers
# (scripts/epreuve-mc.mjs, scripts/epreuve-synthese.mjs). Lancement à la main : Actions → ce passage → Run workflow.
name: Épreuve du moteur (journées archivées)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epreuve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journees:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts   # aucun script d'installation des bibliothèques, PF-47
      - name: Journées de référence (36 dates × 7 guides)
        run: node scripts/epreuve-fetch.mjs out/epreuve
      - name: Résumé
        run: cat out/epreuve/RESUME.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epreuve-journees
          path: out/epreuve
          retention-days: 90

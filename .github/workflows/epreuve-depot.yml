# Phase 8 — Dépose dans la branche les journées de référence téléchargées par « Épreuve du moteur » (artefact),
# compressées (data/epreuve/archives/<guide>.json.gz, environ 2 Mo en tout). Les tirages et l'analyse se rejouent
# ensuite sans réseau, à partir du dépôt (le bac à sable de Claude n'atteint ni Open-Meteo ni le stockage des artefacts).
name: Épreuve du moteur (dépôt des journées)

on:
  push:
    branches: ["claude/phase-8-*"]
    paths: ["data/epreuve/depot.json", ".github/workflows/epreuve-depot.yml"]

permissions:
  contents: write
  actions: read

jobs:
  depot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Passage d'origine
        id: src
        run: echo "run=$(jq -r .run data/epreuve/depot.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: epreuve-journees
          path: out/epreuve
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compression et dépôt
        run: |
          mkdir -p data/epreuve/archives
          for f in out/epreuve/*.json; do gzip -9 -n -c "$f" > "data/epreuve/archives/$(basename "$f").gz"; done
          cp out/epreuve/RESUME.txt data/epreuve/archives/RESUME.txt
          ls -la data/epreuve/archives
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epreuve/archives
          git commit -m "Phase 8 — journées de référence déposées (passage ${{ steps.src.outputs.run }} d'« Épreuve du moteur »)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

# À chaque proposition de modification (et à chaque fusion dans main) : reconstruit le site
# depuis src/, vérifie qu'il est identique aux fichiers publiés, puis rejoue tous les tests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run -s build
      - name: Les fichiers publiés correspondent-ils aux sources ?
        run: |
          git status --porcelain
          git diff --stat --exit-code -- '*.html' home.js sw.js manifest.json '*.png'
      - name: Contrôle du code
        run: npm run -s lint
      - name: Tests unitaires (7 guides + fuseau Auckland)
        run: npm run -s test:unit
      - name: Parcours complets (Chromium)
        run: npm run -s test:e2e
      - name: Contrat Open-Meteo (simulé)
        run: CONTRACT_MOCK=1 npm run -s test:contract
      - name: Studio photo
        run: npm run -s test:studio
      - name: Accessibilité (axe-core)
        run: npm run -s test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-e2e
          path: tests/shots/
          if-no-files-found: ignore

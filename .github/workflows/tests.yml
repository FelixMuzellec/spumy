# À chaque proposition de modification (et à chaque fusion dans main) : reconstruit le site
# depuis src/, vérifie qu'il est identique aux fichiers publiés, puis rejoue tous les tests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04   # Playwright 1.56 ne prend pas en charge Ubuntu 26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # historique complet : lignes d'attribution des commits de la proposition (pare-feux)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pare-feux de la proposition (nom de branche, phase autorisée, lignes d'attribution des commits)
        # Consignes de Félix (docs/regles/PARE-FEUX.md, PF-13 à PF-15). Valeurs passées par l'environnement, jamais
        # insérées dans le script (un nom de branche peut contenir des caractères du shell).
        if: github.event_name == 'pull_request'
        env:
          BRANCHE: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/pare-feux/branche.mjs "$BRANCHE"
          node scripts/pare-feux/commits.mjs "origin/$BASE..$TETE"
      - run: npx playwright install --with-deps chromium
      - run: npm run -s build
      - name: Les fichiers publiés correspondent-ils aux sources ?
        # Fichiers modifiés, ajoutés ou supprimés par la construction : la PR doit contenir le site reconstruit.
        run: |
          changes="$(git status --porcelain --untracked-files=all -- '*.html' '*.js' '*.json' '*.png' ':!tests/**' ':!node_modules/**')"
          echo "$changes"
          test -z "$changes"
      - name: Contrôle du code
        run: npm run -s lint
      - name: Contrôle de types (JSDoc, tsc --checkJs, ADR-V3-020)
        run: npm run -s typecheck
      - name: Aucun secret dans le dépôt
        run: node tests/secrets.mjs
      - name: Pare-feux des consignes de Félix (registre versionné, contrôles directs)
        run: npm run -s test:pare-feux
      - name: Essais de sabotage des pare-feux (chaque violation simulée doit être arrêtée)
        run: npm run -s test:pare-feux-sabotage
      - name: Règles de couches (bord, bateau, commun, design)
        run: npm run -s test:layers
      - name: Socle commun (erreur commune, validation des entrées)
        run: npm run -s test:socle
      - name: Fiches des sites (schéma, données pures, empreinte de chaque spot)
        run: npm run -s test:data
      - name: Spots V2 inventoriés et sauvegardés, inchangés (phase 5)
        run: npm run -s test:spots-v2
      - name: Fiches de spots V3 (schéma § 7.4, aucune perte V2, registre central)
        run: npm run -s test:spots-v3
      - name: Étude du moteur BORD (phase 6 V3, identités ZINB, Gamma–Poisson, classement proposé, résultats reproductibles)
        run: npm run -s test:etude-moteur
      - name: Connaissances halieutiques (niveaux de preuve, sources, rubriques des spots)
        run: npm run -s test:knowledge
      - name: Système de design (contrastes WCAG des deux thèmes)
        run: npm run -s test:design
      - name: Design System V3 (jetons, paliers 0–100, contrastes, CSS généré à jour)
        run: npm run -s test:design-v3
      - name: Moteur v2 (16 scénarios de la spécification, trois scores)
        run: npm run -s test:v2
      - name: Tests unitaires (7 guides + fuseau Auckland)
        run: npm run -s test:unit
      - name: Parcours complets (Chromium)
        run: npm run -s test:e2e
      - name: Contrat Open-Meteo (simulé)
        run: CONTRACT_MOCK=1 npm run -s test:contract
      - name: Mise à jour d'un téléphone (version publiée → cette version)
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          npm run -s test:upgrade
      - name: Studio photo
        run: npm run -s test:studio
      - name: Accessibilité (axe-core)
        run: npm run -s test:a11y
      - name: Prototype de la phase 11 (23 écrans, deux largeurs, deux thèmes, axe-core)
        run: npm run -s test:prototype
      - name: Prototype V3 (parcours, règles, 4 largeurs, deux thèmes, axe)
        run: npm run -s test:prototype-v3
      - name: Logo de marque (poisson et orange intacts dans tous les exports)
        run: |
          python3 -m venv .venv-marque
          .venv-marque/bin/pip install --quiet -r tests/requirements-marque.txt
          .venv-marque/bin/python tests/brand.py
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-e2e
          path: tests/shots/
          if-no-files-found: ignore

},Lh={title:"Principes de la p\xEAche du bar du bord en baie de Douarnenez",items:[{rule:"Les pointes : des zones de passage, \xE0 balayer",source:"pecheaubar.com \u2014 \xAB La P\xEAche au bar en Bretagne : Douarnenez \xBB (mod. 15/10/2026)",explain:"\xAB Toutes les pointes peuvent \xEAtre consid\xE9r\xE9es comme des zones de passage, vous trouverez une solution pour descendre sur la plupart d'entre elles. \xBB \xAB Le but ici est de balayer une zone ou nous savons que les bars vont passer \xE0 un moment ou \xE0 un autre \xBB ; \xAB On privil\xE9giera alors des leurres \xE0 bavette classiques qui peignent toute la couche d'eau \xBB ; \xAB Souvent le passage ne durera qu'un quart d'heure \xBB. Rep\xE9rer \xE0 mar\xE9e basse les roches creuses et les failles o\xF9 \xAB certains bars \xE9lisent temporairement domicile \xBB."},{rule:"Plateaux rocheux : courant de travers, forts coefficients, petite houle",source:"pecheaubar.com \u2014 \xAB La P\xEAche au bar en Bretagne : Douarnenez \xBB",explain:"Chercher des \xAB plateaux rocheux perpendiculaires \xE0 la c\xF4te et l\xE9g\xE8rement immerg\xE9s (entre 50 cm et 3 m) \xBB ; le courant \xAB devra aborder le plateau par le travers \xBB, \xAB surtout lors des forts coefficients \xBB ; \xAB Une petite \xE0 moyenne houle semble encore donner une autre dimension \xE0 ce type de poste \xBB. Le rep\xE9rage \xE0 mar\xE9e basse est \xAB essentiel \xBB."},{rule:"Les plages : fond de baie et c\xF4te nord, de pr\xE9f\xE9rence battues par la houle",source:"pecheaubar.com \u2014 \xAB La P\xEAche au bar en Bretagne : Douarnenez \xBB ; peche-poissons.com \u2014 J.-B. Vidal (19/10/2026)",explain:"Les plages, \xAB peu nombreuses sur la fa\xE7ade sud \xBB, \xAB sont surtout situ\xE9es en fond de baie et sur le secteur nord \xBB ; \xAB Ce sont des secteurs assez r\xE9guliers o\xF9 se concentrent souvent d'importants bancs de bars \xBB ; \xAB vous aurez int\xE9r\xEAt \xE0 opter pour une plage battue par la houle (dans la limite du raisonnable) \xBB. Vidal : \xAB J'ai pris des bars sur chaque plage o\xF9 j'ai pu p\xEAcher entre Crozon et Quimperl\xE9. \xBB Les deux sources d\xE9crivent ici le surfcasting ou la p\xEAche en g\xE9n\xE9ral : au leurre, la r\xE8gle des vagues du guide s'applique."},{rule:"Coup du soir sur les rochers : de grands leurres pour les gros bars",source:"Le blog de Breizh p\xEAche 29 \u2014 G. Rognant, guide de p\xEAche, \xAB Coup du soir en baie de Douarnenez \xBB (01/05/2009)",explain:"Sortie du bord sur les rochers, au coucher du soleil, shad travaill\xE9 dans les vagues \xE0 quelques m\xE8tres : \xAB seuls les leurres de bonne taille (plus 15 cm) prennent des poissons de plus de deux kilos \xBB ; avec des leurres plus petits, des bars de 45 \xE0 50 cm."},{rule:"La mar\xE9e : une r\xE8gle g\xE9n\xE9rale, \xE0 recaler poste par poste",source:"peche-poissons.com \u2014 J.-B. Vidal, \xAB Bar en Bretagne\u2026 o\xF9, quand, comment ? \xBB (19/10/2026)",explain:"R\xE8gle g\xE9n\xE9rale pour le bar en Bretagne, pas propre \xE0 ce secteur : \xAB souvent les 3 premi\xE8res heures de montantes et 3 derni\xE8res heures de descendantes \xBB, coefficients \xAB de 50 \xE0 80 \xBB ; les phases \xAB vont d\xE9pendre de chaque coin \xBB. Quand une fiche n'a pas de source locale pour la mar\xE9e, ses cr\xE9neaux viennent de cette r\xE8gle et le disent."},{rule:"S\xE9curit\xE9 : falaises et d\xE9ferlantes",source:"pecheaubar.com \u2014 \xAB La P\xEAche au bar en Bretagne : Douarnenez \xBB",explain:"\xAB De nombreux secteurs sont dangereux : risques de chute depuis la falaise ou d\xE9ferlantes m\xE9chantes\u2026 \xBB ; les p\xEAches de roche sont \xAB \xE0 aborder de pr\xE9f\xE9rence depuis le bord \xBB."}]},Io=[{id:"dinan",tidePort:"morgat",zone:"local",isLocal:!0,dangerLevel:3,name:"Pointe de Dinan",subtitle:"Ch\xE2teau de Dinan, Crozon, c\xF4te atlantique",distance:"\u2248 10 min",distMin:10,coords:"48\xB013,9'N 4\xB034,3'W",lat:48.231902,lon:-4.570842,type:"POINTE ROCHEUSE / FALAISE",color:"#f
